# Generic ASA packaging card. ASA rides the ABS/ASA material class, which
# supplies cooling (part fan low, aux/exhaust near-off — drafts crack it),
# the heat ceiling, and a 50 °C chamber pre-soak on machines that declare a
# chamber sensor. The density below is ASA's (the class default is ABS's).
material = "asa"
filament_diameter_mm = 1.75
# 260 matches the OrcaSlicer ASA profile that produces the reference-quality
# print on the Sovol Zero (255 printed visibly duller/weaker interlayer welds).
nozzle_temp_c = 260
bed_temp_c = 100
# Retraction distance (mm); direct-drive. 0.5 left ooze zits at every loop
# end next to Orca's 0.8 on the same machine — match the known-good pull.
retract_len_mm = 0.8

# --- calibration (formerly asa-custom, promoted to the default 2026-08-16) ---
density_g_cm3 = 1.07
extrusion_multiplier = 0.9477576236635189
pressure_advance = 0.032
# 40 °C pre-soak, measured comfortable on the Zero (class default is 50).
chamber_temp_c = 40

# --- the first layer ---
# Speed for the whole first layer, every feature alike: slow buys the bond its
# dwell time and keeps the nozzle from dragging a bead that has not stuck yet.
# 55 is Orca's initial-layer speed, which is where this lived before it moved
# off the printer tier — unchanged on purpose, so the move is a relocation and
# not a retune. Tune it per material from here.
first_layer_speed_mm_s = 55.0
# Flow multiplier for the first layer: >1 fills what a textured plate swallows.
# 1.0 until a print says otherwise.
first_layer_flow = 1.0
