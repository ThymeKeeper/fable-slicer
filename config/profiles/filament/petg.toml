# Bambu Lab PETG Basic, as a packaging card — modelled on what a Voron
# running OrcaSlicer actually loads for this spool. Orca's Voron vendor never
# shipped a Bambu PETG profile of its own (and since v2.0 ships no filament
# profiles at all); a Voron gets the shared "Bambu PETG Basic @System" card,
# whose flattened chain is mirrored here. Box side: 255 °C nozzle, Bambu's
# stated range 230–270 (first layer runs flat — the PETG class has no bump;
# hotter first layers shred). Bed: 80 °C — Orca's card says 70 for Bambu's smooth PEI, but the
# textured-plate value is 80 and 70 lifted a corner on the first long-thin
# PETG print here; 80 matches the generic petg card.
material = "petg"
filament_diameter_mm = 1.75
nozzle_temp_c = 255
bed_temp_c = 80
# Retraction distance (mm). 0.8 — what this hotend needs (Orca uses 0.8 for
# every filament on this machine); 0.6 left PETG drawing strings across every
# void crossing. Retraction is really melt-zone volume — a printer property.
retract_len_mm = 0.8

# --- from the Orca card, locally adjusted ---
# Orca's filament_flow_ratio is 0.95; 0.90 measured by print quality
# 2026-08-17 (test prints improved down to 0.90 — the comb's caliper-width
# reading disagreed, see the card history; trust the field). PA 0.05
# provisional until a tower reading.
extrusion_multiplier = 0.90
pressure_advance = 0.05
density_g_cm3 = 1.25
# Orca's card says 13 — a Bambu-hotend rating. On the Sovol Zero, PETG walls
# sustained at 13 shred (2026-08-16, every geometry tried); 9 derives walls
# to ~112 mm/s. Deliberate deviation, under test; raise only against a clean
# print at the higher value.
max_volumetric_speed_mm3_s = 9.0
# Cooling, exactly Orca's card for this spool: 10% base, climbing toward 40%
# only as layers get short enough to need it, 90% on overhangs and bridges.
# A flat 40% base sat here from 2026-08-16 to test a heat-soak theory that the
# next print refuted; measuring what Orca actually EMITS settled it — its
# clean 4-hour PETG print used two duties in the whole file, 0% and 10%, and
# never went above. PETG shrinks under draft, so the base is the number that
# matters and it belongs low.
fan_speed = 0.1
fan_max = 0.4
bridge_fan_speed = 0.9
