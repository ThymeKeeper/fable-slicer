# Voron 2.4 (Klipper, CoreXY, direct drive).
# Assumes a PRINT_START / PRINT_END macro in your printer.cfg that handles
# homing, QGL, bed mesh, nozzle purge and (for PRINT_END) cooldown + park.
inherits = "generic"

# 350mm build (the 2.4 also ships as 250/300 — override with --bed-x/--bed-y).
bed_size_x_mm = 350.0
bed_size_y_mm = 350.0
bed_size_z_mm = 340.0

# Motion limits. Interior features (inner walls, infill, solid, travel) run at
# `acceleration`; the visible outer wall is pinned to a gentle 3000 so ringing
# never reaches the surface, and the first layer auto-derives to 1000 for
# adhesion. Klipper additionally clamps every M204 to printer.cfg max_accel —
# if your config still has the stock 3000, raise it (or lower this) so the
# two agree.
#
# Rated speed 300: a 2.4 is a fast CoreXY and the filament's melt ceiling is
# what actually limits wall speed (the derived speeds flow-cap themselves) —
# understating the machine here just slows travel-adjacent pacing for nothing.
# Jerk maps straight onto Klipper's square_corner_velocity; 5 is the Klipper
# default and the Voron stock value, so the emitted SET_VELOCITY_LIMIT agrees
# with the machine's tuning instead of doubling corner speed (measured against
# the reference prints: SCV 10 was a ringing source, never a time saver).
acceleration = 10000.0
outer_wall_accel = 3000.0
jerk = 5.0
travel_speed_mm_s = 500.0
print_speed_mm_s = 300.0
# First-layer SPEED is filament-tier now (with its flow twin) — how gently a
# material must be laid onto bare plate is a property of the material, not
# the machine. The first-layer ACCEL is not a field anywhere: it is always
# min(1000, acceleration), and a machine wanting a calmer accel says so above.

# Direct-drive extruder: fast retraction. Distance is filament-tier now.
retract_speed_mm_s = 40.0

# Chamber thermistor: the 2.4 spec wires one as [temperature_sensor chamber].
# Filaments that want a warm chamber (ABS/ASA) gate the print on a pre-soak.
# Comment out if your build skipped it.
chamber_sensor = "chamber"

# No aux part fan (M106 P2) or chamber exhaust (M106 P3) on a stock 2.4 — those
# stay off by default (the slicer only emits the P-forms once a printer declares
# the hardware), so nothing to set here.

# Printer connection (Moonraker): uncomment to enable Send / Send & print.
# host_url = "voron24.local"
# api_key = ""

# Bed first, then the chamber soak, then the macro: the nozzle stays cold for
# the whole soak (a hot nozzle drools ABS/ASA for the entire wait — the ooze
# lands in the purge/first layer), and PRINT_START's QGL then runs on a
# heat-soaked frame, which is the order a 2.4 wants anyway. The macro's own
# bed heat is a no-op since M190 already holds it. PLA expands {chamber_soak}
# to nothing.
start_gcode = """
M140 S{bed_temp}
M190 S{bed_temp}
{chamber_soak}
PRINT_START EXTRUDER={first_layer_nozzle_temp} BED={bed_temp}
"""

end_gcode = """
PRINT_END
"""
