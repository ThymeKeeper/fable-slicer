# Sovol Zero (Klipper, CoreXY, high-speed). Build volume 152.4 x 152.4 x 152.5 mm.
inherits = "generic"

bed_size_x_mm = 152.4
bed_size_y_mm = 152.4
bed_size_z_mm = 152.5

# High-speed CoreXY: rated 1200 mm/s / 40000 mm/s², ~50 mm³/s flow hotend.
# Speeds matched to OrcaSlicer's high-speed profile (measured from its
# g-code): inner walls 400 mm/s (Orca asks 500 for sparse but the volumetric
# cap clamps both the same), first layer 55, travel 1000, square-corner
# velocity 5. Basic pla (21 mm³/s, = Orca's generic PLA) is the like-for-like
# pairing; the stock hotend is high-flow (~30 mm³/s PLA), the machine's
# real ceiling — the melt cap is what actually limits speed here.
# (Our external-wall auto stays at 50% of print speed — quality-first — where
# Orca asks 350; pin "external mm/s" in the GUI for Orca's number.)
#
# Acceleration runs well under the 40000 rating: full rate hammers the frame
# on every infill turnaround and travel whip, for ~7% of a Benchy's time
# (40000/10000 → 15000/6000 measured 30m51s → 33m01s). The outer-wall accel
# also paces the top/bottom skins, landing near Orca's 5000 top-surface
# value. First layer still auto-derives to 1000.
acceleration = 15000.0
outer_wall_accel = 6000.0
jerk = 5.0
travel_speed_mm_s = 1000.0
print_speed_mm_s = 400.0
# First-layer SPEED is filament-tier now (with its flow twin) — how gently a
# material must be laid onto bare plate is a property of the material, not
# the machine. The first-layer ACCEL is not a field anywhere: it is always
# min(1000, acceleration), and a machine wanting a calmer accel says so above.

retract_speed_mm_s = 40.0

# Lift on every retracted travel. The retract policy (emit.rs) now retracts
# whenever a travel starts or ends on a VISIBLE bead; the hop is what keeps the
# tip off the finished crowns on the way. Orca's known-good Sovol profile lifts
# 0.4 on effectively every travel (retract_lift_below 150 = the whole machine),
# and a direct-drive Klipper toolhead pays almost nothing for it.
z_hop_mm = 0.4

# Beyond the toolhead part fan: an auxiliary side fan and a chamber exhaust,
# driven Orca/Bambu-style as M106 P2 / M106 P3 (Sovol's Klipper maps them).
# Duties live in the filament tier (aux_fan_speed / exhaust_fan_speed).
aux_fan = true
exhaust_fan = true

# Chamber thermistor, by its Klipper temperature_sensor name (verified live
# against the machine's Moonraker object list). Filaments that want a warm
# chamber (ABS/ASA) gate the print on a pre-soak after the start g-code.
chamber_sensor = "chamber_temp"

# Printer connection (Moonraker): uncomment to enable Send / Send & print.
# Static IP set on the machine itself, outside the router's DHCP pool — .133
# was static-inside-the-pool and collided with the TV, which cost an evening.
host_url = "192.168.1.240"
# api_key = ""

# Stock firmware defines bare START_PRINT / END_PRINT macros that take no
# parameters and do no heating — heat explicitly around them: bed → home →
# START_PRINT → home → park OFF-BED at the wiper corner → chamber soak →
# nozzle heat → CLEAN_NOZZLE_HOT. The nozzle heats only after homing/probing
# AND after the chamber soak, parked off the bed so heat-up/soak ooze drips
# beside the brush, never onto the plate; CLEAN_NOZZLE_HOT (our macro on the
# machine, alongside the cached-Z-anchor START_PRINT) then brushes the hot tip
# and re-homes Z at print temperature — the one and only nozzle heat of the
# whole ceremony on cache-hit prints. After a nozzle or plate change run
# Z_ANCHOR_RESET on the printer so the next print re-runs the full contact
# calibration. The double G28 is vendor-shipped; keep the known-good sequence.
#
# {chamber_soak} expands to a TEMPERATURE_WAIT on the chamber sensor when the
# filament wants a warm chamber (ABS/ASA), and to nothing for PLA. A machine
# with no such sensor aborts there — and the slicer also pings Moonraker before
# sending (when a soak is needed) to catch that with a clear message first.
start_gcode = """
M140 S{bed_temp}
M190 S{bed_temp}
G28
START_PRINT
G28
G90
G1 X-1 Y2 F12000
G1 Z5 F600
{chamber_soak}
M104 S{first_layer_nozzle_temp}
M109 S{first_layer_nozzle_temp}
CLEAN_NOZZLE_HOT
"""

end_gcode = """
END_PRINT
"""
