# 0.20mm standard quality. Geometry intent only — speeds, temperatures, and
# flow are derived from the machine datasheet, the filament packaging, and
# heat control.
layer_height_mm = 0.2
# Fat first layer: +25% squish margin and ~28% more plastic per mm of bead —
# the difference between an ASA part gripping the plate and lifting a corner.
first_layer_height_mm = 0.25
# Counteract first-layer squish bulge so the part base doesn't flare.
elephant_foot_mm = 0.1
wall_count = 2
top_layers = 4
bottom_layers = 4
infill_density = 0.15
sparse_infill = "lines"
solid_infill = "lines"
skirt_loops = 2
skirt_gap_mm = 3.0
brim_loops = 0
seam = "nearest"
